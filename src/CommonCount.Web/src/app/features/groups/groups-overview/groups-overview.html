<section class="groups-page">
  <div class="groups-container">
    <header class="page-header">
      <h1>My groups</h1>
    </header>

    <div class="group-grid">
      @for (group of groups(); track group.id) {
        <mat-card
          class="group-card"
          click="openGroup(group)"
          tabindex="0"
          role="button"
          aria-label="Open group {{ group.name }}"
        >
          <mat-card-header>
            <mat-card-title>{{ group.name }}</mat-card-title>
            <mat-card-subtitle>{{ group.createdAt | date: 'dd/MM/yyyy' }}</mat-card-subtitle>
          </mat-card-header>

          <mat-card-content>
            <p>{{ group.inviteCode }}</p>
          </mat-card-content>
        </mat-card>
      }
      <mat-card
        class="group-card create-group-card"
        (click)="openCreateGroupDialog()"
        tabindex="0"
        role="button"
        aria-label="Create group"
      >
        <mat-card-content>
          <mat-icon>add</mat-icon>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</section>
