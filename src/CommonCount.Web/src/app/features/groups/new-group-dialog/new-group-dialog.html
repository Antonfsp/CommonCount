<mat-dialog-content class="decision-dialog">
  <button mat-fab extended type="button" class="create-group-button" (click)="openCreateGroupDialog()">
    <mat-icon>add</mat-icon>
    Create a new group
  </button>
  <button mat-fab extended type="button" class="join-group-button" (click)="openJoinGroupDialog()">
    <mat-icon>group_add</mat-icon>
    Join an existing group
  </button>
</mat-dialog-content>
