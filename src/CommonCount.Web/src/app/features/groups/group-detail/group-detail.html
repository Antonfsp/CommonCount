  @if (memberLoadError()) {
    <p role="alert">
      {{ memberLoadError() }}
      <button mat-button type="button" (click)="loadGroupMembers()">Retry</button>
    </p>
  }

  <button
    mat-fab
    extended
    class="add-expense-button"
    (click)="openCreateExpenseDialog()"
    type="button"
    aria-label="Add expense"
  >
    <mat-icon>add</mat-icon>
    Add Expense
  </button>

  <button
  mat-fab
  class="settings-button"
  (click)="openGroupSettingsDialog()"
  type="button"
  aria-label="Group settings"
  >
    <mat-icon>settings</mat-icon>
  </button>
</section>
