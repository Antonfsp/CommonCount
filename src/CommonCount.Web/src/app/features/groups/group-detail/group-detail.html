<section class="groups-page">
  <mat-tab-group class="group-detail-tab-group" animationDuration="0">
    <mat-tab label="Expenses">
      <div class="tab-content">
        @if (isLoadingExpenses()) {
          <p role="status">Loading expenses…</p>
        } @else if (expenseLoadError()) {
          <p role="alert">
            {{ expenseLoadError() }}
            <button mat-button type="button" (click)="loadExpenses()">Retry</button>
          </p>
        } @else if (expenses().length === 0) {
          <p>No expenses yet.</p>
        } @else {
          <mat-list class="expense-list">
            @for (expense of expenses(); track expense.id) {
              <button
              mat-list-item
              class="expense-list-item"
              type="button"
              (click)="openEditExpenseDialog(expense)"
              >


              <span matListItemTitle>{{ expense.description }}</span>
                <span matListItemLine>
                  {{ expense.amount | number: '1.2-2' }} € · Paid by {{ expense.paidByMember.name }}
                </span>
              </button>
            }
          </mat-list>
        }
      </div>
    </mat-tab>
    <mat-tab label="Sharing"> Content 2 </mat-tab>
  </mat-tab-group>

  @if (memberLoadError()) {
    <p role="alert">
      {{ memberLoadError() }}
      <button mat-button type="button" (click)="loadGroupMembers()">Retry</button>
    </p>
  }

  <button
    mat-fab
    extended
    class="add-expense-button"
    (click)="openCreateExpenseDialog()"
    type="button"
    aria-label="Add expense"
  >
    <mat-icon>add</mat-icon>
    Add Expense
  </button>

  <button
  mat-fab
  class="settings-button"
  (click)="openGroupSettingsDialog()"
  type="button"
  aria-label="Group settings"
  >
    <mat-icon>settings</mat-icon>
  </button>
</section>
