<h2 mat-dialog-title>Create a group</h2>

<form [formGroup]="form" (ngSubmit)="create()">
  <mat-dialog-content>
    <mat-form-field>
      <mat-label>Group name</mat-label>
      <input matInput formControlName="name" autofocus />
      @if (form.get('name')?.invalid && form.get('name')?.touched) {
        <mat-error>Group name must be at least 2 characters long</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-stroked-button (click)="cancel()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid">Create</button>
  </mat-dialog-actions>
</form>
