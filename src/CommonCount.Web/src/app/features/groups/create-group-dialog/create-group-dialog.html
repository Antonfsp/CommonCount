<div class="dialog-header">
  <h2>Create a group</h2>
</div>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Group name</mat-label>
    <input matInput id="group-name" type="text" formControlName="name" />
    @if (form.get('name')?.invalid && form.get('name')?.touched) {
      <mat-error>Group name is required.</mat-error>
    }
  </mat-form-field>

  <div class="actions" style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px;">
    <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Create</button>
  </div>
</form>
