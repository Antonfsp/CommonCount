<main class="login-page">
  <div class="login-container">
    <header class="page-header">
      <p class="brand-label">COMMONCOUNT</p>
      <h1>Shared costs, clearly counted.</h1>
      <p class="page-description">Bring your group expenses together and see who owes what.</p>
    </header>

    <nav class="login-actions" aria-label="Account actions">
      <button mat-flat-button color="primary" type="button" (click)="openLoginDialog()">
        <mat-icon>login</mat-icon>
        Log in
      </button>
      <button mat-stroked-button type="button" (click)="openRegisterDialog()">
        <mat-icon>person_add</mat-icon>
        Sign up
      </button>
    </nav>
  </div>
</main>
